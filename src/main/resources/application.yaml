server:
  port: 8080
  servlet:
    context-path: /helpdesk

spring:
  profiles:
    active: dev

  application:
    name: helpdesk-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Recife

jwt:
  public:
    key: classpath:keys/public.pem
  private:
    key: classpath:keys/private.pem